name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# Tasmanian with the HIP backend for gfx942 and runs the SparseGrids and Addons
# tests on a simulated AMD Instinct MI300X
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - "SparseGrids/**"
      - "InterfaceTPL/**"
      - "Addons/**"
      - "Config/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hip:
    name: HIP (ROCm 7.1 and simulated MI300X)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and ROCm
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.1"

      # The action installs only the compiler side of ROCm. Tasmanian links
      # rocBLAS, rocSPARSE and rocSOLVER (and hipBLAS/hipSPARSE headers for
      # MAGMA, which stays off).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopenblas-dev libomp-dev \
            rocblas-dev rocsparse-dev rocsolver-dev

      # Release matters: unoptimized HIP code is slow on the simulator. The
      # explicit CMAKE_HIP_ARCHITECTURES keeps CMake from probing for a GPU.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_HIP_COMPILER=/opt/rocm/lib/llvm/bin/clang++ \
            -DCMAKE_HIP_ARCHITECTURES=gfx942 \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DTasmanian_ENABLE_HIP=ON \
            -DTasmanian_ENABLE_OPENMP=ON \
            -DTasmanian_ENABLE_BLAS=ON \
            -DTasmanian_ENABLE_PYTHON=OFF \
            -DTasmanian_ENABLE_FORTRAN=OFF \
            -DTasmanian_ENABLE_MPI=OFF \
            -DTasmanian_TESTS_GPU_ID=0 \
            -DTasmanian_TESTS_OMP_NUM_THREADS=4

      - name: Build
        run: cmake --build build -j3

      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure --no-tests=error -R "SparseGrids|AddonTests"
